# Самопроверка бота: агент «пишет» боту как живой человек и сверяет ответы.
# Лёгкий прогон (без AI, бесплатный) — каждые 15 минут: ловит «бот молчит»,
# «бот отвечает ошибкой», «пропала кнопка».
# Полный прогон (тратит AI) — раз в 6 часов: плюс сохранение мысли и вопрос
# ассистенту, то есть весь путь записи целиком.
#
# Секреты репозитория те же, что у остальных расписаний:
#   APP_URL      — https://life-os.today (без слэша в конце)
#   CRON_SECRET  — то же значение, что в переменных окружения Vercel
#
# Владельцу в Telegram пишет только при поломке и при восстановлении — молчит,
# пока всё хорошо.
name: Bot self-test

on:
  schedule:
    - cron: "*/15 * * * *" # лёгкий прогон каждые 15 минут (без AI, почти бесплатно)
    # Полный прогон — дважды в сутки, а не круглосуточно. Регрессии появляются в
    # момент деплоя, а не сами по себе в четыре утра: после каждого деплоя прогон
    # запускается руками, а расписание здесь — страховка. Именно круглосуточный
    # полный прогон съел почти весь августовский счёт за API.
    - cron: "7 6,18 * * *" # полный прогон: утром и вечером (UTC)
    - cron: "20 6 * * *"   # утренний разбор: что сломалось за сутки
    - cron: "40 7 * * 1"   # понедельник: разбор вопросов бота — что работает, что нет
  workflow_dispatch:
    inputs:
      mode:
        description: "light или full"
        required: false
        default: "full"

jobs:
  selftest:
    runs-on: ubuntu-latest
    if: github.event.schedule != '20 6 * * *' && github.event.schedule != '40 7 * * 1'
    steps:
      - name: Run self-test
        run: |
          MODE="light"
          if [ "${{ github.event.schedule }}" = "7 6,18 * * *" ]; then MODE="full"; fi
          if [ -n "${{ github.event.inputs.mode }}" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          echo "mode=$MODE"
          if [ "$MODE" = "full" ]; then
            # Обе половины подряд с явными номерами: авточередование по времени
            # при запусках в 6:07 и 18:07 выбирало бы одну и ту же половину вечно.
            curl -fsS --max-time 300 "${APP_URL}/api/selftest?key=${CRON_SECRET}&mode=full&of=2&part=0" | tee result.json
            python3 -c "import json,sys; d=json.load(open('result.json')); sys.exit(0 if d.get('ok') else 1)"
            curl -fsS --max-time 300 "${APP_URL}/api/selftest?key=${CRON_SECRET}&mode=full&of=2&part=1" | tee result.json
          else
            curl -fsS --max-time 300 "${APP_URL}/api/selftest?key=${CRON_SECRET}&mode=light" | tee result.json
          fi
          # Падение шага = красный прогон в Actions, чтобы поломка была видна и там.
          python3 -c "import json,sys; d=json.load(open('result.json')); sys.exit(0 if d.get('ok') else 1)"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  # Агент-диагност: раз в сутки читает падения самопроверки, журнал сбоев и жалобы
  # людей и присылает владельцу разбор — что чинить первым и где искать причину.
  diagnose:
    runs-on: ubuntu-latest
    if: github.event.schedule == '20 6 * * *'
    steps:
      - name: Daily diagnosis
        run: |
          curl -fsS --max-time 300 "${APP_URL}/api/diagnose?key=${CRON_SECRET}&hours=24"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  # Агент-редактор вопросов: раз в неделю смотрит, на какие вечерние вопросы люди
  # отвечают, а какие пролистывают, и кладёт предложения на одобрение в админку.
  questions:
    runs-on: ubuntu-latest
    if: github.event.schedule == '40 7 * * 1'
    steps:
      - name: Weekly question review
        run: |
          curl -fsS --max-time 300 "${APP_URL}/api/question-coach?key=${CRON_SECRET}&days=60"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
